name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev,redis]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Baseline eval sanity
        run: |
          python -c "from legalworkbench.cli import app; app()" init
          python -c "from legalworkbench.cli import app; app()" eval --scaled
          python -c "from legalworkbench.cli import app; app()" eval-baseline --dataset synthetic --json > baseline.json
          python - <<'EOF'
          import json
          rows = {row["method"]: row for row in json.load(open("baseline.json"))}
          assert rows["rule_only"]["risk_recall_at_10"] < rows["rag_only"]["risk_recall_at_10"] <= rows["full_system"]["risk_recall_at_10"], rows
          print("baseline ordering ok:", {k: v["risk_recall_at_10"] for k, v in rows.items()})
          EOF
