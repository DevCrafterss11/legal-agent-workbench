name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev,redis]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Ruff undefined-name and import safety
        run: python -m ruff check src tests scripts --select F
      - name: Coverage gate
        run: |
          python -m coverage run --source=src -m pytest tests/ -q
          python -m coverage report --fail-under=50
      - name: MyPy typed persistence boundary
        run: python -m mypy src/legalworkbench/storage/postgres.py --ignore-missing-imports --follow-imports=skip
      - name: Dependency security audit
        run: python -m pip_audit --progress-spinner off --skip-editable
      - name: Redis integration
        env:
          RUN_REDIS_INTEGRATION: "1"
        run: python -m pytest tests/test_mq.py -m integration -q
      - name: Eval regression floors
        run: |
          python -c "from legalworkbench.cli import app; app()" init
          python -c "from legalworkbench.cli import app; app()" eval --scaled
          python -c "from legalworkbench.cli import app; app()" eval-baseline --dataset synthetic --json > baseline.json
          python -c "from legalworkbench.cli import app; app()" eval-real --methods rule_only --json > real_rule.json
          python - <<'EOF'
          import json
          # 合成集自规则引擎重写为不利模式检测后已饱和，作回归下限护栏使用
          rows = {row["method"]: row for row in json.load(open("baseline.json"))}
          assert rows["full_system"]["risk_recall_at_10"] >= 0.95, rows
          assert rows["rule_only"]["risk_recall_at_10"] >= 0.9, rows
          # 真实合同集：规则层必须同时守住精确率与注入召回，防止规则改动回退
          real = json.load(open("real_rule.json"))
          rule = next(m for m in real["methods"] if m["method"] == "rule_only")
          assert rule["precision"] >= 0.5, rule
          assert rule["injected_recall"] >= 0.7, rule
          print("regression floors ok:", {
              "synthetic_full": rows["full_system"]["risk_recall_at_10"],
              "real_rule_precision": rule["precision"],
              "real_rule_injected_recall": rule["injected_recall"],
          })
          EOF
