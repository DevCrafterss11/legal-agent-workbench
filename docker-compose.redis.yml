# Redis for the task bus (Streams) and cache layer.
# AOF everysec: broker 侧丢消息窗口收敛到最多 1 秒的刷盘间隔，
# 单机 demo 与可靠性之间的折中（appendfsync always 会明显拖慢 XADD）。
services:
  redis:
    image: redis:7-alpine
    container_name: lawbench-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - lawbench_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  lawbench_redis_data:
